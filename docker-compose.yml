version: "3.9"

services:
  db_primary:
    image: postgres:15
    container_name: db_primary
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  db_replica:
    image: postgres:15
    container_name: db_replica
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  web:
    build: ./backend
    container_name: django_app
    env_file: .env
    depends_on:
      - db_primary
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend/dev
#      context: ./frontend/prod
      dockerfile: Dockerfile
    container_name: vue_app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: [ "npm", "run", "dev" ]

  nginx:
    image: nginx:latest
    container_name: nginx_proxy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - web
      - frontend

volumes:
  postgres_primary_data:
  postgres_replica_data:
