<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Горизонтальний скрол</title>
    <style rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"></style>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        .horizontal-scroll {
            display: flex;
            overflow-x: scroll;
            overflow-y: hidden;
            height: 100vh;
            scrollbar-width: none; /* Firefox */
            cursor: grab;
        }

        .horizontal-scroll::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }

        .item {
            min-width: 300px;
            height: 100%;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: white;
        }

        .item:nth-child(odd) {
            background: #3498db;
        }

        .item:nth-child(even) {
            background: #e67e22;
        }

        .active {
            cursor: grabbing;
        }
    </style>
</head>
<body>
<div class="horizontal-scroll">
    <div class="item">Block 1</div>
    <div class="item">Block 2</div>
    <div class="item">Block 3</div>
    <div class="item">Block 4</div>
    <div class="item">Block 5</div>
    <div class="item">Block 6</div>
    <div class="item">Block 7</div>
    <div class="item">Block 8</div>
    <div class="item">Block 9</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const slider = document.querySelector('.horizontal-scroll');
    let isDown = false;
    let startX;
    let scrollLeft;

    slider.addEventListener('mousedown', (e) => {
        isDown = true;
        slider.classList.add('active');
        startX = e.pageX - slider.offsetLeft;
        scrollLeft = slider.scrollLeft;
    });

    slider.addEventListener('mouseleave', () => {
        isDown = false;
        slider.classList.remove('active');
    });

    slider.addEventListener('mouseup', () => {
        isDown = false;
        slider.classList.remove('active');
    });

    slider.addEventListener('mousemove', (e) => {
        if (!isDown) return;
        e.preventDefault();
        const x = e.pageX - slider.offsetLeft;
        const walk = (x - startX) * 2; // множник швидкості
        slider.scrollLeft = scrollLeft - walk;
    });
</script>
</body>
</html>
